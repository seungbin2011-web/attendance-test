<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>출퇴근 위치 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .sub {
      color: #6b7280;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .person {
      padding: 14px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .person strong { font-size: 18px; }

    .notice {
      font-size: 13px;
      line-height: 1.55;
      color: #4b5563;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 18px 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .inBtn {
      background: #2563eb;
      color: white;
    }
    .outBtn {
      background: #111827;
      color: white;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result {
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      display: grid;
      gap: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .label {
      color: #6b7280;
      min-width: 110px;
    }
    .value {
      text-align: right;
      font-weight: 600;
      word-break: break-word;
    }
    .ok { color: #15803d; }
    .bad { color: #b91c1c; }
    .wait { color: #92400e; }

    .settings {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>출퇴근 위치 확인</h1>
      <div class="sub">버튼을 누른 시점의 현재 위치를 1회 확인하여 현장 반경 안인지 판정합니다.</div>

      <div class="person">
        근로자<br>
        <strong id="workerName">테스트 근로자</strong>
      </div>

      <div class="notice">
        위치정보는 이 테스트 페이지에서 현장과의 거리 계산에만 사용합니다.
        이 버전은 서버로 위치를 전송하거나 저장하지 않습니다.
        위치 권한을 허용해야 판정할 수 있습니다.
      </div>

      <div class="buttons">
        <button class="inBtn" onclick="checkAttendance('출근')">출근</button>
        <button class="outBtn" onclick="checkAttendance('퇴근')">퇴근</button>
      </div>

      <div class="result">
        <div class="row">
          <div class="label">처리 구분</div>
          <div class="value" id="action">-</div>
        </div>
        <div class="row">
          <div class="label">처리 시간</div>
          <div class="value" id="time">-</div>
        </div>
        <div class="row">
          <div class="label">현장과 거리</div>
          <div class="value" id="distance">-</div>
        </div>
        <div class="row">
          <div class="label">GPS 정확도</div>
          <div class="value" id="accuracy">-</div>
        </div>
        <div class="row">
          <div class="label">판정</div>
          <div class="value" id="status">확인 전</div>
        </div>
      </div>

      <div class="settings">
        ※ 아래 코드의 SITE_LAT / SITE_LNG 값에 실제 현장 좌표를 입력하세요.<br>
        ※ 기본 판정 반경은 200m입니다.
      </div>
    </div>
  </div>

<script>
  // ==========================
  // 여기만 수정하면 됩니다.
  // ==========================
  const WORKER_NAME = "테스트 근로자";

  // 현장 위도 / 경도
  const SITE_LAT = 37.000000;
  const SITE_LNG = 127.000000;

  // 현장 인정 반경(미터)
  const ALLOWED_RADIUS = 200;
  // ==========================

  document.getElementById("workerName").textContent = WORKER_NAME;

  function setText(id, text, className = "") {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "value" + (className ? " " + className : "");
  }

  function formatNow() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    const ss = String(d.getSeconds()).padStart(2, "0");
    return `${y}-${m}-${day} ${hh}:${mm}:${ss}`;
  }

  function toRad(value) {
    return value * Math.PI / 180;
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function checkAttendance(type) {
    setText("action", type);
    setText("time", formatNow());
    setText("distance", "위치 확인 중...");
    setText("accuracy", "-");
    setText("status", "위치 확인 중...", "wait");

    if (!navigator.geolocation) {
      setText("status", "이 브라우저는 위치 기능을 지원하지 않습니다.", "bad");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        const distance = getDistanceMeters(lat, lng, SITE_LAT, SITE_LNG);

        setText("distance", `${Math.round(distance)} m`);
        setText("accuracy", `± ${Math.round(accuracy)} m`);

        if (distance <= ALLOWED_RADIUS) {
          setText("status", `현장 내 · ${type} 가능`, "ok");
        } else {
          setText("status", `현장 외 · ${type} 확인 필요`, "bad");
        }

        console.log({
          type,
          time: formatNow(),
          latitude: lat,
          longitude: lng,
          accuracy,
          distance
        });
      },
      function(error) {
        let msg = "위치를 확인할 수 없습니다.";

        if (error.code === error.PERMISSION_DENIED) {
          msg = "위치 권한이 거부되었습니다.";
        } else if (error.code === error.POSITION_UNAVAILABLE) {
          msg = "현재 위치 정보를 가져올 수 없습니다.";
        } else if (error.code === error.TIMEOUT) {
          msg = "위치 확인 시간이 초과되었습니다.";
        }

        setText("distance", "-");
        setText("accuracy", "-");
        setText("status", msg, "bad");
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  }
</script>
</body>
</html>
