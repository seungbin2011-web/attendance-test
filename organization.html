<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>용인 현장 조직도</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;background:#f3f6f9;color:#243244}
.topbar{background:#17365d;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.brandline{display:flex;gap:9px;align-items:center}.brand{font-weight:900;font-size:22px}.ver{font-size:11px;border:1px solid rgba(255,255,255,.35);padding:3px 7px;border-radius:999px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;background:#fff;color:#17365d;font-weight:900;cursor:pointer}
#fileInput{display:none}.file-name{font-size:12px;opacity:.88}
.page{max-width:1550px;margin:auto;padding:18px}.notice{background:#fff;border-left:5px solid #5b9bd5;padding:13px 15px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);font-size:13px;line-height:1.6;margin-bottom:14px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 9px rgba(0,0,0,.05)}.kpi b{display:block;font-size:22px;color:#17365d}.kpi span{font-size:12px;color:#64748b}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;background:#fff;padding:12px;border-radius:10px;margin-bottom:14px}
input,select{width:100%;border:1px solid #d7e0ea;border-radius:8px;padding:10px;font-size:13px;background:#fff}
.level-title{font-size:13px;font-weight:900;color:#425466;margin:10px 0 8px}
.management{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.teams{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;align-items:start}
.group{background:#fff;border:1px solid #d8e3ef;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.group-title{background:#e8f0f8;color:#17365d;padding:11px 12px;font-weight:900;display:flex;justify-content:space-between;gap:8px}.management-box .group-title{background:#e8f5ec;color:#285c37}
.person{position:relative;margin:8px;padding:10px;border:1px solid #e2e8f0;background:#fafcff;border-radius:9px;cursor:pointer}.person:hover{background:#eef6ff}
.name{font-size:14px;font-weight:900;padding-right:45px}.meta{font-size:11px;color:#64748b;margin-top:3px;line-height:1.5}.leader-badge{position:absolute;right:8px;top:8px;background:#e9f7ef;color:#1f7a49;border:1px solid #b9e0c8;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900}
.empty{padding:18px;text-align:center;color:#94a3b8;font-size:12px}
.detail{display:none;margin-top:16px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}.detail.open{display:block}
.detail-head{background:#17365d;color:#fff;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.detail-head h2{font-size:17px;margin:0}.close{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e5e7eb}.item{background:#fff;padding:12px;min-height:66px}.label{font-size:11px;color:#64748b}.value{font-size:13px;font-weight:800;margin-top:5px;word-break:break-word}
.footer{text-align:center;color:#7b8794;font-size:11px;padding:22px 0 8px}
@media(max-width:1100px){.teams{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.management,.teams{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.page{padding:12px}}

.org-tree{display:flex;flex-direction:column;gap:18px}
.tree-level{display:flex;justify-content:center}
.tree-level.top .group{width:min(680px,100%)}
.tree-level.manager .group{width:min(520px,100%)}
.tree-connector{width:2px;height:22px;background:#B8C6D8;margin:-6px auto 0}
.tree-teams{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;align-items:start}
.group-title.team-title-main{background:#DDEBF7}
.team-leader-zone{padding:8px 8px 0}
.team-member-zone{padding:0 8px 8px}
.zone-label{font-size:10px;font-weight:900;color:#64748b;margin:5px 2px 4px}
.unassigned-fab{position:fixed;right:18px;top:132px;z-index:20;border:0;border-radius:999px;background:#fff3cd;color:#7a5600;padding:10px 14px;font-size:12px;font-weight:900;box-shadow:0 3px 14px rgba(0,0,0,.12);cursor:pointer;border:1px solid #f0d27b}
.unassigned-fab:hover{background:#ffe7a6}
.view-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.view-title h3{margin:0;font-size:14px;color:#425466}
.back-org-btn{border:1px solid #ccd8e6;background:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:900;color:#17365d;cursor:pointer}
.unassigned-page{display:none}
.unassigned-page.active{display:block}
.org-main.hidden{display:none}
.unassigned-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}
@media(max-width:1100px){.tree-teams{grid-template-columns:repeat(3,1fr)}.unassigned-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.tree-teams,.unassigned-grid{grid-template-columns:1fr}.unassigned-fab{right:10px;top:auto;bottom:14px}}


/* v1.8 compact layout */
.page{max-width:1320px}
.tree-level.top .group{width:min(560px,100%)}
.tree-level.manager .group{width:min(430px,100%)}
.tree-teams{
  grid-template-columns:repeat(5,minmax(170px,220px));
  justify-content:center;
  gap:10px;
}
.group{min-width:0}
.group-title{padding:9px 10px}
.person{margin:6px;padding:8px}
.name{font-size:13px}
.meta{font-size:10.5px}
.team-leader-zone{padding:6px 6px 0}
.team-member-zone{padding:0 6px 6px}
.zone-label{margin:4px 2px 3px}
.filters{max-width:1000px;margin-left:auto;margin-right:auto}
.summary{max-width:1000px;margin-left:auto;margin-right:auto}
.notice{max-width:1000px;margin-left:auto;margin-right:auto}
@media(max-width:1180px){
  .tree-teams{grid-template-columns:repeat(3,minmax(180px,230px))}
}
@media(max-width:760px){
  .tree-level.top .group,.tree-level.manager .group{width:100%}
  .tree-teams{grid-template-columns:1fr}
  .page{max-width:none}
}


/* v1.8 upper cards compact */
.tree-level.top .group{width:min(360px,100%)}
.tree-level.manager .group{width:min(280px,100%)}
.tree-level.top .person,
.tree-level.manager .person{padding:6px 7px;margin:4px}
.tree-level.top .group-title,
.tree-level.manager .group-title{padding:7px 9px}
.tree-level.top .name,.tree-level.manager .name{font-size:12px}
.tree-level.top .meta,.tree-level.manager .meta{font-size:10px;line-height:1.35}
.tree-level.top .group-title span:first-child,.tree-level.manager .group-title span:first-child{font-size:12px}
.tree-level.top .group-title span:last-child,.tree-level.manager .group-title span:last-child{font-size:11px}
.tree-connector{height:18px;margin:-2px auto 0}


/* v1.8 top card width fix */
.tree-level.top .group{
  width:280px !important;
  max-width:280px !important;
  flex:0 0 280px !important;
}
.tree-level.manager .group{
  width:230px !important;
  max-width:230px !important;
  flex:0 0 230px !important;
}
.tree-level.top .person,
.tree-level.manager .person{
  padding:5px 6px !important;
  margin:4px !important;
}
.tree-level.top .group-title,
.tree-level.manager .group-title{
  padding:6px 8px !important;
}
.tree-level.top .name,
.tree-level.manager .name{
  font-size:11.5px !important;
}
.tree-level.top .meta,
.tree-level.manager .meta{
  font-size:9.5px !important;
}
@media(max-width:760px){
  .tree-level.top .group,
  .tree-level.manager .group{
    width:100% !important;
    max-width:100% !important;
    flex:1 1 auto !important;
  }
}

</style>
</head>
<body>
<div class="topbar">
  <div class="brandline"><div class="brand">용인 현장 조직도</div><span class="ver">v1.8</span></div>
  <div class="controls">
    <span class="file-name" id="loginUser">조직도</span>
    <button class="btn" type="button" onclick="location.href='index.html'">메인으로</button>
  </div>
</div>

<div class="page">
  <div class="notice">
    <b>용인 현장 조직도</b><br>
    인원정보는 조직도 전용 Google Sheet에서 불러옵니다.
  </div>

  <div class="summary">
    <div class="kpi"><b id="totalCount">0</b><span>전체 인원</span></div>
    <div class="kpi"><b id="leaderCount">0</b><span>팀장 인원</span></div>
    <div class="kpi"><b id="teamCount">0</b><span>등록 팀</span></div>
    <div class="kpi"><b id="reviewCount">0</b><span>미지정 인원</span></div>
  </div>

  <div class="filters">
    <input id="search" placeholder="이름 / 직무 / 팀역할 검색">
    <select id="teamFilter"><option value="">전체 팀</option></select>
    <select id="activeFilter"><option value="">전체 상태</option><option value="Y">사용</option><option value="N">미사용</option></select>
  </div>

  
  <button class="unassigned-fab" id="unassignedFab" type="button" onclick="showUnassignedPage()">미지정 0명</button>

  <div class="org-main" id="orgMain">
    <div class="org-tree">
      <div class="tree-level top" id="officeLevel"></div>
      <div class="tree-connector"></div>
      <div class="tree-level manager" id="managerLevel"></div>
      <div class="tree-connector"></div>

      <div class="view-title">
        <h3>현장 팀 조직</h3>
      </div>
      <div class="tree-teams" id="teams"></div>
    </div>
  </div>

  <div class="unassigned-page" id="unassignedPage">
    <div class="view-title">
      <h3>미지정 인원</h3>
      <button class="back-org-btn" type="button" onclick="showOrganizationPage()">조직도로 돌아가기</button>
    </div>
    <div class="unassigned-grid" id="unassignedGrid"></div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-head"><h2 id="detailTitle">인원 상세</h2><button class="close" onclick="closeDetail()">×</button></div>
    <div class="detail-grid" id="detailGrid"></div>
  </div>

  <div class="footer">© 2026 Yongin Site Organization · v1.8</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbydU13x0H55aSMcn6pC3MBah9ZWx-wKvyjizpx2hr7oRHkpZpBdf0Bbb56nLQdovj-5/exec";
let people=[];

const detailFields=[
  ["사용자ID","사용자ID"],["성명","성명"],["직급","직급"],["권한","권한"],["팀","팀"],
  ["팀 구성 원본","팀구성원본"],["팀 역할 원본","팀역할원본"],["현장원본","현장원본"],["TBM현장","TBM현장"],
  ["직무","직무"],["H/P","H/P"],["소속","소속"],["투입가능일","투입가능일"],["등록여부","등록여부"],
  ["상시출입증번호","상시출입증번호"],["능력","능력"],["경력특이사항","경력특이사항"],["진행상황","진행상황"],
  ["비고","비고"],["검토필요","검토필요"]
];

document.getElementById("search").addEventListener("input",render);
document.getElementById("teamFilter").addEventListener("change",render);
document.getElementById("activeFilter").addEventListener("change",render);

function clean(v){return String(v??"").trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    if(API_URL.includes("PASTE_ORGANIZATION_APPS_SCRIPT_EXEC_URL_HERE")){
      reject(new Error("조직도 Apps Script URL을 organization.html에 입력해주세요."));
      return;
    }
    const cb="org_cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("조직도 DB 응답 시간 초과"));},15000);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      s.remove();
    }
    window[cb]=(data)=>{cleanup();resolve(data)};
    const q=new URLSearchParams({...params,callback:cb});
    s.src=API_URL+"?"+q.toString();
    s.onerror=()=>{cleanup();reject(new Error("조직도 DB 연결 실패"));};
    document.body.appendChild(s);
  });
}

async function init(){
  document.getElementById("loginUser").textContent="인원DB 확인 중";
  try{
    const res=await jsonp({action:"personnelOrg"});
    if(!(res&&res.success)) throw new Error(res?.message||"인원DB를 불러오지 못했습니다.");
    people=(res.people||[]).filter(p=>clean(p["성명"]));
    document.getElementById("loginUser").textContent=`조직도 · ${people.length}명`;
    buildFilters();
    render();
  }catch(err){
    console.error(err);
    document.getElementById("loginUser").textContent="조직도 DB 연결 확인";
    document.getElementById("management").innerHTML=
      `<div class="group management-box"><div class="empty">${esc(err.message)}</div></div>`;
    document.getElementById("teams").innerHTML="";
  }
}

function buildFilters(){
  const teams=[...new Set(people.map(p=>clean(p["팀"])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  document.getElementById("teamFilter").innerHTML=
    '<option value="">전체 팀</option>'+teams.map(t=>`<option>${esc(t)}</option>`).join("");
}

function filtered(){
  const q=clean(document.getElementById("search").value).toLowerCase();
  const team=clean(document.getElementById("teamFilter").value);
  const active=clean(document.getElementById("activeFilter").value);
  return people.filter(p=>{
    const text=[p["성명"],p["직무"],p["팀역할원본"],p["직급"],p["권한"],p["팀"]].map(clean).join(" ").toLowerCase();
    return (!q||text.includes(q))&&(!team||clean(p["팀"])===team)&&(!active||clean(p["사용여부"])===active);
  });
}

function render(){
  const rows=filtered();

  const allUnassigned=people.filter(p=>!clean(p["팀"]) || !["용인사무실","현장소장","자재팀","공사1팀","공사2팀","공사3팀","공사4팀"].includes(clean(p["팀"])));

  document.getElementById("totalCount").textContent=people.length;
  document.getElementById("leaderCount").textContent=people.filter(p=>clean(p["직급"])==="팀장").length;
  document.getElementById("teamCount").textContent=new Set(people.map(p=>clean(p["팀"])).filter(Boolean)).size;
  document.getElementById("reviewCount").textContent=allUnassigned.length;

  document.getElementById("unassignedFab").textContent=`미지정 ${allUnassigned.length}명`;

  const office=rows.filter(p=>clean(p["팀"])==="용인사무실");
  const manager=rows.filter(p=>clean(p["팀"])==="현장소장");

  document.getElementById("officeLevel").innerHTML=group("용인 사무실",office,true);
  document.getElementById("managerLevel").innerHTML=group("현장 소장",manager,true);

  const order=["자재팀","공사1팀","공사2팀","공사3팀","공사4팀"];
  document.getElementById("teams").innerHTML=
    order.map(t=>teamGroup(t,rows.filter(p=>clean(p["팀"])===t))).join("");

  renderUnassigned(allUnassigned);
  closeDetail();
}


function teamGroup(title,members){
  const leaders=[...members].filter(p=>clean(p["직급"])==="팀장").sort(sortPerson);
  const workers=[...members].filter(p=>clean(p["직급"])!=="팀장").sort(sortPerson);

  return `<div class="group">
    <div class="group-title team-title-main"><span>${esc(title)}</span><span>${members.length}명</span></div>
    <div class="team-leader-zone">
      <div class="zone-label">팀장</div>
      ${leaders.length?leaders.map(personCard).join(""):'<div class="empty">팀장 미지정</div>'}
    </div>
    <div class="team-member-zone">
      <div class="zone-label">팀원</div>
      ${workers.length?workers.map(personCard).join(""):'<div class="empty">팀원 없음</div>'}
    </div>
  </div>`;
}

function renderUnassigned(rows){
  const wrap=document.getElementById("unassignedGrid");
  if(!wrap) return;
  wrap.innerHTML=rows.length
    ? rows.sort(sortPerson).map(p=>`<div class="group">${personCard(p)}</div>`).join("")
    : '<div class="group"><div class="empty">미지정 인원이 없습니다.</div></div>';
}

function showUnassignedPage(){
  document.getElementById("orgMain").classList.add("hidden");
  document.getElementById("unassignedPage").classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function showOrganizationPage(){
  document.getElementById("unassignedPage").classList.remove("active");
  document.getElementById("orgMain").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function group(title,members,management){
  members=[...members].sort(sortPerson);
  return `<div class="group ${management?'management-box':''}">
    <div class="group-title"><span>${esc(title)}</span><span>${members.length}명</span></div>
    ${members.length?members.map(personCard).join(""):'<div class="empty">등록 인원 없음</div>'}
  </div>`;
}

function sortPerson(a,b){
  const ra=clean(a["직급"])==="팀장"?0:1;
  const rb=clean(b["직급"])==="팀장"?0:1;
  return ra-rb || clean(a["성명"]).localeCompare(clean(b["성명"]),"ko");
}

function personCard(p){
  const idx=people.indexOf(p);
  const leader=clean(p["직급"])==="팀장";
  return `<div class="person" onclick="showDetail(${idx})">
    ${leader?'<span class="leader-badge">팀장</span>':''}
    <div class="name">${esc(p["성명"])}</div>
    <div class="meta">${esc(clean(p["직무"])||clean(p["직급"])||"-")}<br>${esc(clean(p["팀역할원본"])||clean(p["현장원본"])||"-")}</div>
  </div>`;
}

function showDetail(idx){
  const p=people[idx]; if(!p)return;
  document.getElementById("detailTitle").textContent=`${clean(p["성명"])} 상세정보`;
  document.getElementById("detailGrid").innerHTML=
    detailFields.map(([l,k])=>`<div class="item"><div class="label">${esc(l)}</div><div class="value">${esc(formatValue(p[k])||"-")}</div></div>`).join("");
  const d=document.getElementById("detail");
  d.classList.add("open");
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function closeDetail(){document.getElementById("detail").classList.remove("open")}
function formatValue(v){return clean(v)}

init();
</script>
</body>
</html>
