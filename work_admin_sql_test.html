<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공무 작업 입력 TEST SQL</title>
<style>
:root{--navy:#173A63;--bg:#F3F6F9;--line:#DCE4EB;--text:#17222D;--muted:#71808E;--green:#24734A;--orange:#A85E00;--red:#B13A3A}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;color:var(--navy)}.sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}label{font-size:10.5px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.span2{grid-column:span 2}.span4{grid-column:span 4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.item:first-child{border-top:0}.item strong{font-size:13px}.meta{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9.5px;font-weight:900}.badge.plan{background:#EEF2F5;color:#64717D}.badge.run{background:#FFF1DF;color:var(--orange)}.badge.done{background:#E7F6EC;color:var(--green)}.empty{font-size:11px;color:var(--muted);padding:12px 0}.footer{text-align:center;font-size:10px;color:#8A97A3;padding:8px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.span4{grid-column:span 2}}@media(max-width:480px){.grid{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>공무 작업 입력 <small style="font-size:10px;color:#8392A0">TEST SQL v0.1</small></h1><div class="sub">Supabase PostgreSQL을 사용하는 독립 작업입력 테스트 페이지입니다.</div></div><button class="btn" onclick="location.href='work_dashboard_sql_test.html'">현황판</button></div>
<div class="card"><div class="grid">
<div><label>작업일</label><input type="date" id="workDate"></div><div><label>구분</label><select id="type" onchange="syncWorkDateByType()"><option>금일</option><option>명일</option></select></div><div><label>팀</label><input id="team" placeholder="예: 공사1팀"></div><div><label>팀장</label><input id="leader" placeholder="성명"></div>
<div class="span2"><label>작업자</label><input id="workers" placeholder="홍길동, 김철수" oninput="syncHeadcountFromWorkers()"></div><div><label>투입인원</label><input id="headcount" type="number" min="0" value="0"></div><div><label>상태</label><select id="status"><option>예정</option><option>진행</option><option>완료</option></select></div>
<div><label>동 / 구역</label><input id="building" placeholder="예: 5동"></div><div><label>층</label><input id="floor" placeholder="예: 3F"></div><div class="span2"><label>작업위치</label><input id="place" placeholder="예: 1호계단 / EPS실"></div>
<div class="span2"><label>공종</label><input id="trade" list="tradeOptions" placeholder="예: 케이블 포설"><datalist id="tradeOptions"><option value="배관"><option value="배선"><option value="케이블 포설"><option value="기구 취부"><option value="ALC"><option value="경량"><option value="기타"></datalist></div><div><label>계획물량</label><input id="plannedQuantity" type="number" min="0" step="any" placeholder="선택 입력"></div><div><label>단위</label><select id="unit"><option value="">선택 안 함</option><option>m</option><option>개</option><option>EA</option><option>식</option><option>세대</option><option>회선</option><option>기타</option></select></div>
<div class="span4"><label>작업내용</label><textarea id="content" placeholder="예: 보이스 간선 케이블 포설"></textarea></div><div class="span4"><label>비고</label><input id="note" placeholder="특이사항"></div></div>
<div class="actions"><button class="btn primary" id="saveBtn" onclick="saveWork()">DB 저장</button><button class="btn" onclick="resetForm()">새 작업</button><span class="sub" id="editInfo">신규 작업 입력</span></div></div>
<div class="card"><div class="top" style="margin-bottom:4px"><div><strong style="color:var(--navy)">금일 / 명일 작업 목록</strong><div class="sub">수정할 작업을 누르면 위 입력란에 불러옵니다.</div></div><button class="btn" id="refreshBtn" onclick="loadList()">새로고침</button></div><div id="list"></div></div>
<div class="footer">© 공무 현황관리 Prototype</div></div>
<script>
const SUPABASE_URL='https://cgeciwdibirvdsucgrnz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Ui2gOfJoBOvtN4mWwN5Paw_tjvSdxJs';
const WORK_COLUMNS=['work_id','work_date','work_type','team','leader','workers','headcount','building','floor','place','trade','content','planned_qty','unit','status','note'].join(',');
let rows=[],editingId='',headcountManuallyEdited=false;
function c(v){return String(v??'').trim()}function e(v){return c(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dateString(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function today(){return dateString(new Date())}function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return dateString(d)}
function syncWorkDateByType(){const td=today(),tm=tomorrow();if(type.value==='명일'&&workDate.value===td)workDate.value=tm;else if(type.value==='금일'&&workDate.value===tm)workDate.value=td}
function syncHeadcountFromWorkers(){if(!headcountManuallyEdited)headcount.value=c(workers.value)?workers.value.split(',').map(c).filter(Boolean).length:0}
headcount.addEventListener('input',()=>{headcountManuallyEdited=true});
function sbHeaders(extra={}){return {apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY,...extra}}
async function sbRequest(query,{method='GET',body,prefer}={}){const headers=sbHeaders(body?{'Content-Type':'application/json'}:{});if(prefer)headers.Prefer=prefer;const res=await fetch(SUPABASE_URL+'/rest/v1/works'+query,{method,headers,body:body?JSON.stringify(body):undefined});if(!res.ok){let detail={};try{detail=await res.json()}catch{}const err=new Error(detail.message||detail.hint||('Supabase 요청 실패 ('+res.status+')'));err.status=res.status;err.code=detail.code;throw err}if(res.status===204||res.headers.get('content-length')==='0')return null;return res.json()}
function mapRow(r){return {workId:r.work_id,workDate:c(r.work_date).slice(0,10),type:r.work_type,team:r.team,leader:r.leader,workers:r.workers,headcount:r.headcount,building:r.building,floor:r.floor,place:r.place,trade:r.trade,content:r.content,plannedQuantity:r.planned_qty,unit:r.unit,status:r.status,note:r.note}}
function resetForm(){editingId='';workDate.value=today();type.value='금일';team.value='';leader.value='';workers.value='';headcount.value=0;headcountManuallyEdited=false;status.value='예정';building.value='';floor.value='';place.value='';trade.value='';plannedQuantity.value='';unit.value='';content.value='';note.value='';editInfo.textContent='신규 작업 입력'}
function getPayload(){return {work_date:workDate.value,work_type:type.value,team:c(team.value)||null,leader:c(leader.value)||null,workers:c(workers.value)||null,headcount:Number(headcount.value||0),building:c(building.value)||null,floor:c(floor.value)||null,place:c(place.value)||null,trade:c(trade.value)||null,content:c(content.value),planned_qty:c(plannedQuantity.value)===''?null:Number(plannedQuantity.value),unit:c(unit.value)||null,status:status.value,note:c(note.value)||null,updated_at:new Date().toISOString()}}
function validatePayload(p){if(!p.work_date||(!p.team&&!p.leader)||!p.content)throw new Error('작업일, 팀/팀장, 작업내용을 확인해주세요.');if(p.planned_qty!==null&&!Number.isFinite(p.planned_qty))throw new Error('계획물량을 숫자로 입력해주세요.');if(!Number.isFinite(p.headcount)||p.headcount<0)throw new Error('투입인원을 확인해주세요.')}
async function nextWorkId(workDate,minSequence=0){const ymd=workDate.replaceAll('-',''),prefix='WK-'+ymd+'-',params=new URLSearchParams({select:'work_id',work_date:'eq.'+workDate,is_active:'eq.true',work_id:'like.'+prefix+'*',order:'work_id.desc',limit:'1'}),found=await sbRequest('?'+params),last=found?.[0]?.work_id||'',parsed=Number(last.slice(prefix.length))||0,next=Math.max(parsed,minSequence)+1;if(next>999)throw new Error('해당 날짜의 작업ID가 999번을 초과했습니다.');return prefix+String(next).padStart(3,'0')}
async function insertWork(p){let floor=0;for(let attempt=0;attempt<8;attempt++){const workId=await nextWorkId(p.work_date,floor);try{await sbRequest('',{method:'POST',body:{work_id:workId,...p,is_active:true},prefer:'return=minimal'});return workId}catch(err){if(err.status!==409&&err.code!=='23505')throw err;floor=Number(workId.slice(-3))}}throw new Error('작업ID 충돌이 반복되었습니다. 다시 시도해주세요.')}
async function saveWork(){let p;try{p=getPayload();validatePayload(p)}catch(err){alert(err.message);return}saveBtn.disabled=true;saveBtn.textContent='DB 저장 중...';try{if(editingId){const params=new URLSearchParams({work_id:'eq.'+editingId,is_active:'eq.true'});await sbRequest('?'+params,{method:'PATCH',body:p,prefer:'return=minimal'})}else await insertWork(p);resetForm();await loadList()}catch(err){alert(err.message)}finally{saveBtn.disabled=false;saveBtn.textContent='DB 저장'}}
function editWork(id){const r=rows.find(x=>x.workId===id);if(!r)return;editingId=r.workId;workDate.value=r.workDate;type.value=workType(r)||'금일';team.value=r.team||'';leader.value=r.leader||'';workers.value=r.workers||'';headcount.value=r.headcount||0;headcountManuallyEdited=true;status.value=r.status||'예정';building.value=r.building||'';floor.value=r.floor||'';place.value=r.place||'';trade.value=r.trade||'';plannedQuantity.value=r.plannedQuantity??'';unit.value=r.unit||'';content.value=r.content||'';note.value=r.note||'';editInfo.textContent='수정 중 · '+r.workId;scrollTo({top:0,behavior:'smooth'})}
async function disableWork(id){if(!confirm('이 작업을 목록에서 제외할까요?\n기록은 삭제하지 않고 is_active=false로 변경합니다.'))return;try{const params=new URLSearchParams({work_id:'eq.'+id,is_active:'eq.true'});await sbRequest('?'+params,{method:'PATCH',body:{is_active:false,updated_at:new Date().toISOString()},prefer:'return=minimal'});if(editingId===id)resetForm();await loadList()}catch(err){alert(err.message)}}
function badge(s){return s==='완료'?'done':(s==='진행'?'run':'plan')}function workType(r){const t=c(r.type);if(t==='금일'||t==='명일')return t;return r.workDate===today()?'금일':(r.workDate===tomorrow()?'명일':'')}
async function loadList(){refreshBtn.disabled=true;refreshBtn.textContent='확인 중...';try{const params=new URLSearchParams({select:WORK_COLUMNS,is_active:'eq.true',work_date:'in.('+today()+','+tomorrow()+')',order:'work_date.asc,team.asc'}),data=await sbRequest('?'+params);rows=(data||[]).map(mapRow);list.innerHTML=rows.map(r=>`<div class="item"><div onclick="editWork('${e(r.workId)}')" style="cursor:pointer"><strong>${e(workType(r))} · ${e(r.team||r.leader||'-')} · ${e(r.building||'')} ${e(r.floor||'')}</strong> <span class="badge ${badge(r.status)}">${e(r.status)}</span><div class="meta">${e(r.workDate)} · ${e(r.place||'-')}<br>${e(r.content)} · 투입 ${e(r.headcount)}명</div></div><button class="btn danger" onclick="disableWork('${e(r.workId)}')">제외</button></div>`).join('')||'<div class="empty">등록된 금일/명일 작업이 없습니다.</div>'}catch(err){list.innerHTML='<div class="empty">'+e(err.message)+'</div>'}finally{refreshBtn.disabled=false;refreshBtn.textContent='새로고침'}}
resetForm();loadList();
</script></body></html>
