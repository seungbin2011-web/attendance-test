<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팀원 홈 TEST</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#17365d;
  --blue:#2f7df4;
  --bg:#f3f6f9;
  --line:#dce5ee;
  --text:#243244;
  --muted:#6b7b8c;
  --green:#2f855a;
}
body{
  margin:0;
  font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.topbar{
  background:var(--navy);
  color:#fff;
  padding:15px 18px;
  position:sticky;
  top:0;
  z-index:10;
}
.topbar-inner{
  max-width:560px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.brand{font-size:19px;font-weight:900}
.ver{
  margin-left:7px;
  font-size:10px;
  padding:3px 7px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{
  background:#fff;
  border:1px solid #e3eaf1;
  border-radius:15px;
  box-shadow:0 3px 14px rgba(0,0,0,.05);
  overflow:hidden;
  margin-bottom:12px;
}
.user-card{padding:18px}
.hello{font-size:12px;color:var(--muted);margin-bottom:5px}
.name{font-size:22px;font-weight:900;color:var(--navy)}
.meta{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.section-title{
  padding:12px 14px;
  font-size:14px;
  font-weight:900;
  color:var(--navy);
  background:#eef4fa;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.section-body{padding:12px}
.person{
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:8px;
  background:#fbfdff;
}
.person:last-child{margin-bottom:0}
.person-name{font-size:14px;font-weight:900}
.person-meta{font-size:11px;color:var(--muted);margin-top:3px}
.badge{
  display:inline-block;
  font-size:10px;
  font-weight:900;
  border-radius:999px;
  padding:3px 7px;
  margin-left:6px;
  vertical-align:1px;
}
.badge.leader{background:#e9f7ef;color:#1f7a49;border:1px solid #b9e0c8}
.badge.me{background:#eef5ff;color:#245da8;border:1px solid #c9dcfa}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.btn{
  min-height:52px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}
.btn.primary{background:var(--blue);color:#fff}
.btn.secondary{background:var(--navy);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{
  background:#fff;
  color:var(--navy);
  border:1px solid #ccd8e6;
}
.status{
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#f8fafc;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.footer{
  text-align:center;
  color:#8a97a6;
  font-size:10.5px;
  padding:10px 0 18px;
}
@media(max-width:420px){
  .wrap{padding:12px}
  .actions{grid-template-columns:1fr}
}

.attendance-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.attendance-item{
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fbfdff;
}
.attendance-item span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}
.attendance-item strong{
  display:block;
  font-size:14px;
  color:var(--navy);
}
.attendance-item strong.done{color:var(--green)}


.my-task{
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  margin-bottom:9px;
  background:#fbfdff;
}
.my-task:last-child{margin-bottom:0}
.my-task-title{font-size:14px;font-weight:900;color:var(--navy)}
.my-task-role{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:999px;background:#EEF5FF;color:#245DA8;font-size:10px;font-weight:900}
.my-task-meta{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:6px}
.tbm-directive{margin-top:8px;padding:9px 10px;border-radius:9px;background:#FFF8E8;border:1px solid #F0D9A8;font-size:11.5px;line-height:1.55}
.changed-badge{color:#C65A00;font-weight:900}
.my-task-completed{border:1px solid #C9DED0;border-radius:11px;background:#F4F8F5;margin-bottom:9px;overflow:hidden}
.my-task-completed summary{list-style:none;cursor:pointer;padding:12px 13px;font-size:13px;font-weight:900;color:#24734A;display:flex;justify-content:space-between;gap:8px}
.my-task-completed summary::-webkit-details-marker{display:none}
.my-task-completed[open] summary{border-bottom:1px solid #D9E7DE}
.my-task-completed-body{padding:12px}
.complete-pill{padding:3px 7px;border-radius:999px;background:#E5F4EA;color:#24734A;font-size:10px;font-weight:900;white-space:nowrap}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">팀원 홈 <span class="ver">TEST v0.10</span></div>
    <div style="display:flex;gap:6px">
      <button class="btn ghost" style="min-height:auto;padding:8px 10px;font-size:11px" onclick="goHome()">홈으로</button>
      <button class="btn ghost" style="min-height:auto;padding:8px 10px;font-size:11px" onclick="logout()">로그아웃</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="user-card">
      <div class="hello">로그인 사용자</div>
      <div class="name" id="myName">-</div>
      <div class="meta" id="myMeta">-</div>
      <div class="status" id="myPolicy" style="margin-top:10px">출결 정책 확인 중</div>

      <div class="actions">
        <button class="btn primary" onclick="goAttendance()">출결 등록</button>
        <button class="btn secondary" id="refreshAllBtn" onclick="refreshAll()">팀 다시 확인</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>오늘 출결 상태</span>
      <span id="attendanceDate">-</span>
    </div>
    <div class="section-body">
      <div class="attendance-summary">
        <div class="attendance-item">
          <span>출근</span>
          <strong id="checkinStatus">미등록</strong>
        </div>
        <div class="attendance-item">
          <span>퇴근</span>
          <strong id="checkoutStatus">미등록</strong>
        </div>
      </div>
      <div class="status" id="attendanceNotice" style="margin-top:10px">
        출결 등록 결과가 여기에 표시됩니다.
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>오늘 내 작업 / TBM 지시</span>
      <span id="myTaskCount">0건</span>
    </div>
    <div class="section-body" id="myTasks">
      <div class="status">오늘 작업 지시를 확인하는 중입니다.</div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>우리 팀장</span>
      <span id="leaderCount">0명</span>
    </div>
    <div class="section-body" id="leaders">
      <div class="status">팀 정보를 불러오는 중입니다.</div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <span>우리 팀원</span>
      <span id="memberCount">0명</span>
    </div>
    <div class="section-body" id="members">
      <div class="status">팀 정보를 불러오는 중입니다.</div>
    </div>
  </section>

  <div class="status" id="notice">
    로그인한 사용자의 팀 기준으로 최소한의 인원 정보만 표시합니다.
  </div>

  <div class="footer">© 2026 용인 현장 근태 · 팀원 홈 TEST v0.10</div>
</main>

<script>
const ORGANIZATION_API_URL="https://script.google.com/macros/s/AKfycbydU13x0H55aSMcn6pC3MBah9ZWx-wKvyjizpx2hr7oRHkpZpBdf0Bbb56nLQdovj-5/exec";
const TBM_API_URL="https://script.google.com/macros/s/AKfycbyPtHjGZXnke0iRRG11jQWFZ-ysxe9vq5YKPr89F80ZN3GxANCNjV2BgzSeql5WK2chwQ/exec";

let authUser=null;
let refreshAllBusy=false;

function clean(v){return String(v??"").trim()}
function esc(v){
  return clean(v).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function readAuth(){
  try{
    const raw=sessionStorage.getItem("attendanceAuthUser");
    if(!raw) return null;
    const user=JSON.parse(raw);
    return user && user.name ? user : null;
  }catch(e){
    return null;
  }
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="member_home_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("인원DB 응답 시간 초과"));},15000);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      s.remove();
    }
    window[cb]=(data)=>{cleanup();resolve(data)};
    const q=new URLSearchParams({...params,callback:cb});
    s.src=ORGANIZATION_API_URL+"?"+q.toString();
    s.onerror=()=>{cleanup();reject(new Error("인원DB 연결 실패"));};
    document.body.appendChild(s);
  });
}

function personCard(p,kind){
  const isMe=clean(p.userId)===clean(authUser.userId);
  return `<div class="person">
    <div class="person-name">
      ${esc(p.name)}
      ${kind==="leader"?'<span class="badge leader">팀장</span>':""}
      ${isMe?'<span class="badge me">나</span>':""}
    </div>
    <div class="person-meta">${esc(p.job||p.rank||"-")}</div>
  </div>`;
}

function attendanceGradeLabel(grade){
  const g=clean(grade||"A").toUpperCase();
  if(g==="B") return "B · 이동근무";
  if(g==="C") return "C · 자유근무";
  return "A · 일반근무";
}

function todayDate(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function attendanceStorageKey(userId,date){
  return `attendanceStatus:${userId}:${date}`;
}

function loadAttendanceStatus(){
  if(!authUser) return {};
  try{
    return JSON.parse(localStorage.getItem(attendanceStorageKey(authUser.userId,todayDate()))||"{}");
  }catch(e){
    return {};
  }
}

function renderAttendanceStatus(){
  const state=loadAttendanceStatus();
  document.getElementById("attendanceDate").textContent=todayDate();

  const inEl=document.getElementById("checkinStatus");
  const outEl=document.getElementById("checkoutStatus");
  const notice=document.getElementById("attendanceNotice");

  if(state["출근"]){
    inEl.textContent=`요청 완료 ${state["출근"].time||""}`;
    inEl.className="done";
  }else{
    inEl.textContent="미등록";
    inEl.className="";
  }

  if(state["퇴근"]){
    outEl.textContent=`요청 완료 ${state["퇴근"].time||""}`;
    outEl.className="done";
  }else{
    outEl.textContent="미등록";
    outEl.className="";
  }

  const grade=clean(authUser?.attendanceGrade||"A").toUpperCase();
  if(grade==="C"){
    const activities=(state.activities||[]);
    notice.textContent=activities.length
      ? `오늘 활동 기록 ${activities.length}건이 있습니다.`
      : "자유근무 대상입니다. 필요한 출결/이동 기록을 남겨주세요.";
  }else if(state["퇴근"]){
    notice.textContent="오늘 출근·퇴근 처리 요청이 모두 완료되었습니다.";
  }else if(state["출근"]){
    notice.textContent="오늘 출근 처리 요청이 완료되었습니다. 퇴근 시 다시 출결 등록을 눌러주세요.";
  }else{
    notice.textContent="아직 오늘 출근 기록이 없습니다.";
  }
}

function tbmJsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="member_tbm_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("TBM DB 응답 시간 초과"));},15000);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      s.remove();
    }
    window[cb]=(data)=>{cleanup();resolve(data)};
    const q=new URLSearchParams({...params,callback:cb,_t:Date.now()});
    s.src=TBM_API_URL+"?"+q.toString();
    s.onerror=()=>{cleanup();reject(new Error("TBM DB 연결 실패"));};
    document.body.appendChild(s);
  });
}

async function loadMyTodayTasks(){
  const wrap=document.getElementById("myTasks");
  try{
    const res=await tbmJsonp({
      action:"memberTodayTasks",
      userId:authUser.userId,
      date:todayDate()
    });
    if(!(res&&res.success)) throw new Error(res?.message||"오늘 작업 조회 실패");

    const tasks=res.tasks||[];
    const tbm=(res.tbm||[]).filter(x=>x.note||x.extra);

    document.getElementById("myTaskCount").textContent=`${tasks.length}건`;

    if(!tasks.length){
      wrap.innerHTML='<div class="status">오늘 나에게 배정된 작업이 없습니다.</div>';
      return;
    }

    const latestTbm=tbm[0]||null;
    wrap.innerHTML=tasks.map(t=>{
      const body=`
        <div class="my-task-title">
          작업 ${esc(t.taskNo)} · ${esc(t.place||"-")}
          <span class="my-task-role">${esc(t.role||"작업자")}</span>
        </div>
        <div class="my-task-meta">
          작업내용: ${esc(t.content||"-")}<br>
          팀장: ${esc(t.leader||"-")} · 현장: ${esc(t.site||"-")}<br>
          예상종료: ${esc(t.endTime||"-")}
          ${t.changed?'<br><span class="changed-badge">※ 작업 변경 이력 있음</span>':""}
          ${t.afternoonStatus?`<br>오후 TBM: <strong>${esc(t.afternoonStatus)}</strong>`:""}
          ${t.eveningStatus?`<br>퇴근 TBM: <strong>${esc(t.eveningStatus)}</strong>`:""}
        </div>
        <div class="tbm-directive">
          <strong>안전/TBM 지시</strong><br>
          위험요인: ${esc(t.risks||"없음")}<br>
          안전조치: ${esc(t.safety||"-")}
        </div>`;

      if(t.completed){
        return `
          <details class="my-task-completed">
            <summary>
              <span>✓ 작업 ${esc(t.taskNo)} · ${esc(t.place||"-")}</span>
              <span class="complete-pill">퇴근 완료</span>
            </summary>
            <div class="my-task-completed-body">${body}</div>
          </details>`;
      }

      return `<div class="my-task">${body}</div>`;
    }).join("");
  }catch(err){
    console.error(err);
    wrap.innerHTML='<div class="status">오늘 작업/TBM 지시를 불러오지 못했습니다.<br>'+esc(err.message)+'</div>';
  }
}

async function refreshAll(){
  if(refreshAllBusy) return;

  const btn=document.getElementById("refreshAllBtn");
  refreshAllBusy=true;

  const oldText=btn ? btn.textContent : "";
  if(btn){
    btn.disabled=true;
    btn.textContent="확인 중...";
  }

  try{
    // 화면 전체를 새로고침하지 않고 필요한 데이터만 동시에 재조회
    renderAttendanceStatus();

    await Promise.all([
      loadMyTodayTasks(),
      reloadTeam()
    ]);
  }catch(err){
    console.error("전체 다시 확인 실패",err);
  }finally{
    refreshAllBusy=false;
    if(btn){
      btn.disabled=false;
      btn.textContent=oldText || "팀 다시 확인";
    }
  }
}

async function reloadTeam(){
  const notice=document.getElementById("notice");
  document.getElementById("leaders").innerHTML='<div class="status">팀 정보를 불러오는 중입니다.</div>';
  document.getElementById("members").innerHTML='<div class="status">팀 정보를 불러오는 중입니다.</div>';

  try{
    const res=await jsonp({
      action:"teamView",
      userId:authUser.userId
    });

    if(!(res&&res.success)){
      throw new Error(res?.message||"팀 정보를 불러오지 못했습니다.");
    }

    const leaders=res.leaders||[];
    const members=res.members||[];

    document.getElementById("leaderCount").textContent=`${leaders.length}명`;
    document.getElementById("memberCount").textContent=`${members.length}명`;

    document.getElementById("leaders").innerHTML=
      leaders.length ? leaders.map(p=>personCard(p,"leader")).join("") :
      '<div class="status">등록된 팀장이 없습니다.</div>';

    document.getElementById("members").innerHTML=
      members.length ? members.map(p=>personCard(p,"member")).join("") :
      '<div class="status">등록된 팀원이 없습니다.</div>';

    notice.textContent=`${res.team||authUser.team||"팀"} · 총 ${leaders.length+members.length}명`;
  }catch(err){
    console.error(err);
    document.getElementById("leaders").innerHTML='<div class="status">팀 정보를 불러오지 못했습니다.</div>';
    document.getElementById("members").innerHTML='<div class="status">팀 정보를 불러오지 못했습니다.</div>';
    notice.textContent=err.message||"인원DB 연결을 확인해주세요.";
  }
}

function goAttendance(){
  location.href="index_test.html?mode=attendance";
}

function goHome(){
  // 브라우저 뒤로가기를 사용하지 않고 팀원 홈을 기준점으로 유지
  history.replaceState(null,"",location.pathname);
  window.scrollTo({top:0,behavior:"smooth"});
}

function logout(){
  sessionStorage.removeItem("attendanceAuthUser");
  sessionStorage.removeItem("tbmAuthUser");
  location.href="index_test.html";
}

(function init(){
  authUser=readAuth();

  if(!authUser){
    alert("로그인이 필요합니다.");
    location.href="index_test.html";
    return;
  }

  document.getElementById("myName").textContent=authUser.name||"-";
  document.getElementById("myMeta").textContent=
    [authUser.userId,authUser.team,authUser.rank||authUser.role,authUser.defaultSite||authUser.site]
      .filter(Boolean).join(" · ");

  document.getElementById("myPolicy").textContent=
    `출결등급 ${attendanceGradeLabel(authUser.attendanceGrade)}`;

  renderAttendanceStatus();
  refreshAll();
})();
</script>
</body>
</html>
