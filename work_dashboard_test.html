<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공무 일일 작업 현황판 TEST</title>
<style>
:root{--navy:#173A63;--blue:#245B8E;--bg:#F3F6F9;--line:#DCE4EB;--text:#17222D;--muted:#71808E;--green:#24734A;--orange:#A85E00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;color:var(--navy)}.sub{font-size:11px;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.hero-title{font-size:18px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-radius:11px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:rgba(255,255,255,.72)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.toolbar{display:grid;grid-template-columns:150px 1fr 1fr 1.5fr;gap:8px}select,input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-title strong{color:var(--navy);font-size:15px}
.task{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:120px 120px 1fr 90px;gap:10px;align-items:start}.task:first-child{border-top:0}.tname{font-weight:900;color:var(--navy)}.meta{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}.content{font-size:12.5px;font-weight:800}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9.5px;font-weight:900}.plan{background:#EEF2F5;color:#64717D}.run{background:#FFF1DF;color:var(--orange)}.done{background:#E7F6EC;color:var(--green)}.empty{font-size:11px;color:var(--muted);padding:12px 0}.footer{text-align:center;font-size:10px;color:#8A97A3;padding:8px}
@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.task{grid-template-columns:1fr 1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.task{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>일일 작업 현황판 <small style="font-size:10px;color:#8392A0">TEST v0.1</small></h1><div class="sub">공무 현황관리 독립 Prototype</div></div><div><button class="btn" onclick="location.href='work_admin_test.html'">작업 입력</button> <button class="btn" id="refreshBtn" onclick="load()">새로고침</button></div></div>
<div class="hero"><div class="hero-title">오늘 누가 어디에서 무엇을 하고 있는가</div><div class="sub" style="color:rgba(255,255,255,.72)">금일 작업과 명일 예정 작업을 빠르게 확인합니다.</div><div class="stats">
<div class="stat"><b id="sPeople">0</b><span>금일 투입인원</span></div><div class="stat"><b id="sTeams">0</b><span>금일 작업팀</span></div><div class="stat"><b id="sToday">0</b><span>금일 작업</span></div><div class="stat"><b id="sRun">0</b><span>진행</span></div><div class="stat"><b id="sDone">0</b><span>완료</span></div><div class="stat"><b id="sTomorrow">0</b><span>명일 예정</span></div></div></div>
<div class="card"><div class="toolbar"><select id="dayFilter" onchange="render()"><option value="">금일 + 명일</option><option value="금일">금일</option><option value="명일">명일</option></select><select id="teamFilter" onchange="render()"><option value="">전체 팀</option></select><select id="buildingFilter" onchange="render()"><option value="">전체 동/구역</option></select><input id="search" placeholder="팀장 / 작업위치 / 작업내용 검색" oninput="render()"></div></div>
<div class="card"><div class="section-title"><strong>금일 작업</strong><span class="badge run" id="todayCount">0건</span></div><div id="todayList"></div></div>
<div class="card"><div class="section-title"><strong>명일 작업</strong><span class="badge plan" id="tomorrowCount">0건</span></div><div id="tomorrowList"></div></div>
<div class="footer">© 공무 현황관리 Prototype</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzM8FH_KKRbHyxZEBB2QWAQDr2q-aCsCSm0Yf5QLCzpgFUjLT6OiO52VHZI_XpqyXZ8/exec';let rows=[],baseDate='',nextDate='';
function c(v){return String(v??'').trim()}function e(v){return c(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function jsonp(params){return new Promise((resolve,reject)=>{if(API_URL.includes('PASTE_'))return reject(new Error('Apps Script 배포 URL을 입력해주세요.'));const cb='dash_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const t=setTimeout(()=>{if(done)return;done=true;window[cb]=()=>{};s.remove();reject(new Error('DB 응답 시간 초과'))},20000);window[cb]=d=>{if(done)return;done=true;clearTimeout(t);window[cb]=()=>{};s.remove();resolve(d)};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_t:Date.now()});s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();reject(new Error('DB 연결 실패'))};document.body.appendChild(s)})}
function badge(s){return s==='완료'?'done':(s==='진행'?'run':'plan')}
function fillFilters(){const teams=[...new Set(rows.map(r=>r.team).filter(Boolean))].sort(),buildings=[...new Set(rows.map(r=>r.building).filter(Boolean))].sort(),tv=teamFilter.value,bv=buildingFilter.value;teamFilter.innerHTML='<option value="">전체 팀</option>'+teams.map(x=>`<option>${e(x)}</option>`).join('');buildingFilter.innerHTML='<option value="">전체 동/구역</option>'+buildings.map(x=>`<option>${e(x)}</option>`).join('');teamFilter.value=tv;buildingFilter.value=bv}
function taskHtml(r){return `<div class="task"><div><div class="tname">${e(r.team||'-')}</div><div class="meta">${e(r.leader||'-')} · ${e(r.headcount)}명</div></div><div><strong>${e(r.building||'-')} ${e(r.floor||'')}</strong><div class="meta">${e(r.place||'-')}</div></div><div><div class="content">${e(r.content||'-')}</div><div class="meta">${r.workers?'작업자 '+e(r.workers)+' · ':''}${e(r.note||'')}</div></div><div><span class="badge ${badge(r.status)}">${e(r.status)}</span></div></div>`}
function render(){const day=dayFilter.value,team=teamFilter.value,building=buildingFilter.value,q=c(search.value).toLowerCase(),filtered=rows.filter(r=>{const type=r.workDate===baseDate?'금일':(r.workDate===nextDate?'명일':r.type);if(day&&type!==day)return false;if(team&&r.team!==team)return false;if(building&&r.building!==building)return false;const hay=[r.team,r.leader,r.workers,r.building,r.floor,r.place,r.content,r.note].map(c).join(' ').toLowerCase();return !q||hay.includes(q)}),tRows=filtered.filter(r=>r.workDate===baseDate),nRows=filtered.filter(r=>r.workDate===nextDate);todayCount.textContent=tRows.length+'건';tomorrowCount.textContent=nRows.length+'건';todayList.innerHTML=tRows.map(taskHtml).join('')||'<div class="empty">조건에 맞는 금일 작업이 없습니다.</div>';tomorrowList.innerHTML=nRows.map(taskHtml).join('')||'<div class="empty">조건에 맞는 명일 작업이 없습니다.</div>';const allToday=rows.filter(r=>r.workDate===baseDate);sPeople.textContent=allToday.reduce((a,r)=>a+Number(r.headcount||0),0);sTeams.textContent=new Set(allToday.map(r=>r.team||r.leader).filter(Boolean)).size;sToday.textContent=allToday.length;sRun.textContent=allToday.filter(r=>r.status==='진행').length;sDone.textContent=allToday.filter(r=>r.status==='완료').length;sTomorrow.textContent=rows.filter(r=>r.workDate===nextDate).length}
async function load(){refreshBtn.disabled=true;refreshBtn.textContent='확인 중...';try{const res=await jsonp({action:'listWork',date:today(),range:'todayTomorrow'});if(!res?.success)throw new Error(res?.message||'조회 실패');rows=res.rows||[];baseDate=res.baseDate||today();nextDate=res.nextDate||'';fillFilters();render()}catch(err){todayList.innerHTML='<div class="empty">'+e(err.message)+'</div>';tomorrowList.innerHTML=''}finally{refreshBtn.disabled=false;refreshBtn.textContent='새로고침'}}
load();
</script></body></html>
