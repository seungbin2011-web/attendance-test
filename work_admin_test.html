<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공무 작업 입력 TEST</title>
<style>
:root{--navy:#173A63;--bg:#F3F6F9;--line:#DCE4EB;--text:#17222D;--muted:#71808E;--green:#24734A;--orange:#A85E00;--red:#B13A3A}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;color:var(--navy)}.sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}label{font-size:10.5px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.span2{grid-column:span 2}.span4{grid-column:span 4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.item:first-child{border-top:0}.item strong{font-size:13px}.meta{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9.5px;font-weight:900}.badge.plan{background:#EEF2F5;color:#64717D}.badge.run{background:#FFF1DF;color:var(--orange)}.badge.done{background:#E7F6EC;color:var(--green)}.empty{font-size:11px;color:var(--muted);padding:12px 0}.footer{text-align:center;font-size:10px;color:#8A97A3;padding:8px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.span4{grid-column:span 2}}@media(max-width:480px){.grid{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>공무 작업 입력 <small style="font-size:10px;color:#8392A0">TEST v0.3</small></h1><div class="sub">기존 근태/TBM 시스템과 분리된 독립 테스트 페이지입니다.</div></div><button class="btn" onclick="location.href='work_dashboard_test.html'">현황판</button></div>
<div class="card"><div class="grid">
<div><label>작업일</label><input type="date" id="workDate"></div><div><label>구분</label><select id="type" onchange="syncWorkDateByType()"><option>금일</option><option>명일</option></select></div><div><label>팀</label><input id="team" placeholder="예: 공사1팀"></div><div><label>팀장</label><input id="leader" placeholder="성명"></div>
<div class="span2"><label>작업자</label><input id="workers" placeholder="홍길동, 김철수" oninput="syncHeadcountFromWorkers()"></div><div><label>투입인원</label><input id="headcount" type="number" min="0" value="0"></div><div><label>상태</label><select id="status"><option>예정</option><option>진행</option><option>완료</option></select></div>
<div><label>동 / 구역</label><input id="building" placeholder="예: 5동"></div><div><label>층</label><input id="floor" placeholder="예: 3F"></div><div class="span2"><label>작업위치</label><input id="place" placeholder="예: 1호계단 / EPS실"></div>
<div class="span2"><label>공종</label><input id="trade" list="tradeOptions" placeholder="예: 케이블 포설"><datalist id="tradeOptions"><option value="배관"><option value="배선"><option value="케이블 포설"><option value="기구 취부"><option value="ALC"><option value="경량"><option value="기타"></datalist></div><div><label>계획물량</label><input id="plannedQuantity" type="number" min="0" step="any" placeholder="선택 입력"></div><div><label>단위</label><select id="unit"><option value="">선택 안 함</option><option>m</option><option>개</option><option>EA</option><option>식</option><option>세대</option><option>회선</option><option>기타</option></select></div>
<div class="span4"><label>작업내용</label><textarea id="content" placeholder="예: 보이스 간선 케이블 포설"></textarea></div><div class="span4"><label>비고</label><input id="note" placeholder="특이사항"></div></div>
<div class="actions"><button class="btn primary" id="saveBtn" onclick="saveWork()">DB 저장</button><button class="btn" onclick="resetForm()">새 작업</button><span class="sub" id="editInfo">신규 작업 입력</span></div></div>
<div class="card"><div class="top" style="margin-bottom:4px"><div><strong style="color:var(--navy)">금일 / 명일 작업 목록</strong><div class="sub">수정할 작업을 누르면 위 입력란에 불러옵니다.</div></div><button class="btn" id="refreshBtn" onclick="loadList()">새로고침</button></div><div id="list"></div></div>
<div class="footer">© 공무 현황관리 Prototype</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzM8FH_KKRbHyxZEBB2QWAQDr2q-aCsCSm0Yf5QLCzpgFUjLT6OiO52VHZI_XpqyXZ8/exec';let rows=[],editingId='';
function c(v){return String(v??'').trim()}function e(v){return c(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dateString(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function today(){return dateString(new Date())}function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return dateString(d)}
function syncWorkDateByType(){const td=today(),tm=tomorrow();if(type.value==='명일'&&workDate.value===td)workDate.value=tm;else if(type.value==='금일'&&workDate.value===tm)workDate.value=td}
function syncHeadcountFromWorkers(){headcount.value=c(workers.value)?workers.value.split(',').map(c).filter(Boolean).length:0}
function jsonp(params){return new Promise((resolve,reject)=>{if(API_URL.includes('PASTE_'))return reject(new Error('Apps Script 배포 URL을 입력해주세요.'));const cb='wk_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const t=setTimeout(()=>{if(done)return;done=true;window[cb]=()=>{};s.remove();reject(new Error('DB 응답 시간 초과'))},20000);window[cb]=d=>{if(done)return;done=true;clearTimeout(t);window[cb]=()=>{};s.remove();resolve(d)};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_t:Date.now()});s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();reject(new Error('DB 연결 실패'))};document.body.appendChild(s)})}
async function post(body){if(API_URL.includes('PASTE_'))throw new Error('Apps Script 배포 URL을 입력해주세요.');await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
function resetForm(){editingId='';workDate.value=today();type.value='금일';team.value='';leader.value='';workers.value='';headcount.value=0;status.value='예정';building.value='';floor.value='';place.value='';trade.value='';plannedQuantity.value='';unit.value='';content.value='';note.value='';editInfo.textContent='신규 작업 입력'}
function getPayload(){return {action:'saveWork',workId:editingId,workDate:workDate.value,type:type.value,team:team.value,leader:leader.value,workers:workers.value,headcount:Number(headcount.value||0),building:building.value,floor:floor.value,place:place.value,trade:trade.value,content:content.value,plannedQuantity:c(plannedQuantity.value)===''?'':Number(plannedQuantity.value),unit:unit.value,status:status.value,note:note.value}}
async function saveWork(){const p=getPayload();if(!p.workDate||(!p.team&&!p.leader)||!p.content){alert('작업일, 팀/팀장, 작업내용을 확인해주세요.');return}saveBtn.disabled=true;saveBtn.textContent='DB 저장 중...';try{await post(p);await new Promise(r=>setTimeout(r,800));resetForm();await loadList()}catch(err){alert(err.message)}finally{saveBtn.disabled=false;saveBtn.textContent='DB 저장'}}
function editWork(id){const r=rows.find(x=>x.workId===id);if(!r)return;editingId=r.workId;workDate.value=r.workDate;type.value=r.type||'금일';team.value=r.team;leader.value=r.leader;workers.value=r.workers;headcount.value=r.headcount||0;status.value=r.status||'예정';building.value=r.building;floor.value=r.floor;place.value=r.place;trade.value=r.trade||'';plannedQuantity.value=r.plannedQuantity??'';unit.value=r.unit||'';content.value=r.content;note.value=r.note;editInfo.textContent='수정 중 · '+r.workId;scrollTo({top:0,behavior:'smooth'})}
async function disableWork(id){if(!confirm('이 작업을 목록에서 제외할까요?\n기록은 삭제하지 않고 사용여부만 N으로 변경합니다.'))return;await post({action:'setWorkActive',workId:id,active:false});await new Promise(r=>setTimeout(r,700));loadList()}
function badge(s){return s==='완료'?'done':(s==='진행'?'run':'plan')}
async function loadList(){refreshBtn.disabled=true;refreshBtn.textContent='확인 중...';try{const res=await jsonp({action:'listWork',date:today(),range:'todayTomorrow'});if(!res?.success)throw new Error(res?.message||'조회 실패');rows=res.rows||[];list.innerHTML=rows.map(r=>`<div class="item"><div onclick="editWork('${e(r.workId)}')" style="cursor:pointer"><strong>${e(r.type)} · ${e(r.team||r.leader||'-')} · ${e(r.building||'')} ${e(r.floor||'')}</strong> <span class="badge ${badge(r.status)}">${e(r.status)}</span><div class="meta">${e(r.workDate)} · ${e(r.place||'-')}<br>${e(r.content)} · 투입 ${e(r.headcount)}명</div></div><button class="btn danger" onclick="disableWork('${e(r.workId)}')">제외</button></div>`).join('')||'<div class="empty">등록된 금일/명일 작업이 없습니다.</div>'}catch(err){list.innerHTML='<div class="empty">'+e(err.message)+'</div>'}finally{refreshBtn.disabled=false;refreshBtn.textContent='새로고침'}}
resetForm();loadList();
</script></body></html>
