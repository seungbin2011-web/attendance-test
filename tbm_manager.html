<!DOCTYPE html>
<!-- 운영 화면: tests/make_prod_pages.py가 tbm_manager_test.html에서 만든다. 직접 고치지 말 것 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173A63">
<title>현장 TBM 현황</title>
<link rel="stylesheet" href="tbm_test.css?v=0.7">
<style>
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.toolbar input{height:44px}
.refresh-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.team-list{display:flex;flex-direction:column;gap:12px}
.team-card{border:1px solid #D9E3ED;border-radius:14px;background:#fff;padding:14px;box-shadow:0 6px 18px rgba(16,44,77,.05)}
.team-card.missing{background:#FAFBFC;border-style:dashed}
.team-card.attention{border-color:#F4A29B;box-shadow:0 0 0 2px #FEE4E2 inset}
.team-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.team-name{font-size:16px;font-weight:900;color:var(--navy)}
.team-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.team-task{font-size:12px;line-height:1.55;color:#344054;border-top:1px dashed #E4E7EC;padding-top:6px;margin-top:6px}
.detail-btn{margin-top:10px;width:100%;border:1px solid #CAD8E8;background:#F5F9FF;color:var(--navy);border-radius:10px;min-height:42px;font-size:13px;font-weight:900;cursor:pointer}
.detail-section{margin-top:14px}
.detail-section h3{font-size:14px;color:var(--navy);margin:0 0 8px}
.history{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.55}
.history li{border-left:3px solid #D6E4F3;padding:3px 0 3px 9px;margin-bottom:5px}
.history time{color:var(--muted);margin-right:6px}
.alert-line{font-weight:800}.alert-line.RISK{color:var(--red)}.alert-line.CHANGED,.alert-line.DELAYED{color:#8A5600}
body.admin-mode .team-name,body.admin-mode .stage-title{color:#164936}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum{border:1px solid #E4E7EC;border-radius:11px;padding:9px 6px;text-align:center;background:#F9FBFD}
.sum b{display:block;font-size:18px;color:var(--navy)}.sum span{font-size:11px;color:var(--muted);font-weight:800}
.sum.danger b{color:var(--red)}.sum.warn b{color:#8A5600}
.filters{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.filter-btn{border:1px solid #CBD8E7;background:#fff;color:var(--navy);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;cursor:pointer}
.filter-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.auto-line{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--navy)}.auto-line input{width:16px;height:16px}
body.admin-mode .filter-btn.selected{background:#164936;border-color:#164936}
body.admin-mode #guideBtn{display:none}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand-row"><div class="brand">현장 TBM 현황</div><span class="version" id="pageVersion">v1.0</span></div>
  <div class="brand-sub" id="headerSub">로그인 정보를 확인하는 중입니다…</div>
</div></header>
<main class="wrap">
  <div class="message" id="message" role="status" aria-live="polite"></div>

  <section class="card" id="blocked" hidden>
    <div class="title">이 화면을 열 수 없습니다</div>
    <div class="desc" id="blockedText"></div>
    <button class="btn save" id="goLogin" type="button">통합 로그인으로</button>
  </section>

  <div class="app-stage" id="stageList">
    <div class="stage-nav"><div class="stage-nav-inner">
      <div class="stage-title">팀별 TBM 현황 (읽기 전용)</div>
      <div class="stage-actions"><a class="stage-small-btn" id="guideBtn" href="guides/site-manager-tbm-guide.pdf" target="_blank" rel="noopener" style="text-decoration:none;white-space:nowrap">사용 가이드</a><button class="stage-small-btn" id="logoutBtn" type="button">로그아웃</button></div>
    </div></div>
    <section class="card">
      <div class="toolbar">
        <div><label class="label" for="dateInput">날짜</label><input id="dateInput" type="date"></div>
        <button class="stage-small-btn" id="refreshBtn" type="button" style="height:44px">새로고침</button>
      </div>
      <div class="refresh-line"><span id="loadedAt">-</span><label class="auto-line"><input type="checkbox" id="autoRefresh">60초마다 자동 새로고침</label></div>
      <div class="summary-grid" id="summaryGrid"></div>
      <div class="filters" id="filters">
        <button class="filter-btn selected" type="button" data-filter="all">전체</button>
        <button class="filter-btn" type="button" data-filter="attention">확인 필요</button>
        <button class="filter-btn" type="button" data-filter="missing">미보고</button>
      </div>
      <div class="notice" style="margin:12px 0 0">이 화면은 조회만 합니다. 승인·반려와 자재 요청 처리는 다음 단계에서 추가됩니다. 확인 필요: 팀장이 "소장 확인 필요"를 표시했거나 위험 작업이 있는 팀.</div>
    </section>
    <div class="team-list" id="teamList"></div>
  </div>

  <div class="app-stage" id="stageDetail">
    <div class="stage-nav"><div class="stage-nav-inner">
      <div class="stage-title" id="detailTitle">보고 상세</div>
      <div class="stage-actions"><button class="stage-small-btn" id="detailRefresh" type="button">새로고침</button><button class="stage-small-btn" type="button" data-go="stageList">목록</button></div>
    </div></div>
    <section class="card" id="detailBody"></section>
  </div>

  <div class="footer">© 2026 TBM Manager · <span id="footerVersion">v1.0</span></div>
</main>
<div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
  <div class="loading-card"><div class="loading-spinner"></div><div class="loading-title" id="loadingTitle">불러오는 중입니다</div><div class="loading-sub">서버 응답을 기다리는 중입니다.</div></div>
</div>
<script type="module" src="tbm_manager_test.mjs?v=1.1"></script>
</body>
</html>
